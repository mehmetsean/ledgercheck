name: Bug report
description: Something is wrong or a check fails
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Say what you did and what you expected.
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command
      description: The exact ledgercheck command, and the exact synthbiz command if you made the data with it.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: ledgercheck version and Python version
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: Paste the error or the lines that look wrong. Do not paste real company data.
